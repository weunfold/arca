[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.29.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/automagik-si/arca"

# Every external version is an exact pin, written once here. A crate takes one with `.workspace = true`.
# The pins read from this host's cargo cache or from the crates.io index on 2026-10-30.
# The workspace crates are listed now so that no later group edits this file. Cargo ignores an entry no member uses, so
# the entries for crates that do not exist yet resolve nothing.
[workspace.dependencies]
arca = { path = "crates/arca" }
arca-alerts = { path = "crates/arca-alerts" }
arca-api = { path = "crates/arca-api" }
arca-approval = { path = "crates/arca-approval" }
arca-hostnet = { path = "crates/arca-hostnet" }
arca-incus = { path = "crates/arca-incus" }
arca-kernel = { path = "crates/arca-kernel" }
arca-link = { path = "crates/arca-link" }
arca-mcp = { path = "crates/arca-mcp" }
arca-metrics = { path = "crates/arca-metrics" }
arca-netproject = { path = "crates/arca-netproject" }
arca-postgres = { path = "crates/arca-postgres" }
arca-providers = { path = "crates/arca-providers" }
arca-reconcile = { path = "crates/arca-reconcile" }
arca-store = { path = "crates/arca-store" }
arca-vm = { path = "crates/arca-vm" }
arca-watch = { path = "crates/arca-watch" }
arca-wit = { path = "crates/arca-wit" }
axum = "=0.8.9"
hyper-util = { version = "=0.1.21", default-features = false, features = ["server-auto", "service", "tokio", "http1"] }
base64 = "=0.23.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.4.3"
# Link transport and ticket releases verified 2026-11-03; terminal QR encoder (MIT).
# unstable-custom-transports is the only way 1.4.1 lets a path be preferred (the PathSelector trait); the pin is exact.
iroh = { version = "=1.4.1", features = ["unstable-custom-transports"] }
iroh-tickets = "=1.0.0"
qrcodegen = "=1.8.0"
regex = "=1.13.1"
# The GitHub signer's outbound HTTPS client (api.github.com and the Actions service). In the lock already through
# iroh-relay with the same feature; the crypto provider is ring through `rustls` below, never aws-lc, and the roots are
# webpki-roots, so a static binary needs no system certificate store.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
webpki-roots = "=1.0.11"
# RS256 passkeys (some Windows Hello and TPM authenticators): RSASSA-PKCS1-v1_5 verification. In the lock already through
# ssh-key. One private-key operation exists: the GitHub signer signs its App's short-lived JWT with the App's key, which
# it alone reads (crates/arca/src/github_api.rs).
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
# SQLite is compiled from its bundled source, so the static musl build needs no system library.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# The browser passkey test's TLS front, and the GitHub signer's client config. Both are in the lock already through iroh;
# ring, never aws-lc.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
# Safe wrappers for the few file calls std lacks: an exclusive read-only open of a disk, and mkdirat/openat walks. And
# for a signal sent through a pid descriptor, which cannot reach a process that took over a pid.
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# Names the field a refused config value is in. In the lock already through axum.
serde_path_to_error = "=0.1.20"
sha2 = "=0.11.1"
# Constant-time comparison of pairing code digests.
subtle = "=2.6.1"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
tokio = "=1.54.1"
tokio-stream = "=0.1.19"
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "wat", "std"] }
wit-component = "=0.261.0"
wit-parser = "=0.261.0"

[workspace.lints.rust]
unsafe_code = "forbid"
