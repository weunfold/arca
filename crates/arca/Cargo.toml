[package]
name = "arca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Automagik Arca node binary: one-shot watch and metrics reads, token minting, the recording shim and the Arca MCP server, all from one node config file"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arca-alerts.workspace = true
arca-api.workspace = true
arca-approval.workspace = true
arca-hostnet.workspace = true
arca-incus.workspace = true
arca-kernel.workspace = true
arca-link.workspace = true
arca-mcp.workspace = true
arca-metrics.workspace = true
arca-netproject.workspace = true
arca-postgres.workspace = true
arca-providers.workspace = true
arca-reconcile.workspace = true
arca-store.workspace = true
arca-watch.workspace = true
regex.workspace = true
rustix.workspace = true
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true

[dev-dependencies]
iroh-tickets.workspace = true
# The plan tests drive the toy plugin, which only the reconciler's `toy` feature builds.
arca-reconcile = { workspace = true, features = ["toy"] }
ed25519-dalek.workspace = true
rusqlite.workspace = true
# The passkey tests sign with a software P-256 passkey.
p256.workspace = true
# The browser passkey test serves the page over https://localhost to a real Chromium.
rustls.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
