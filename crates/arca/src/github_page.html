<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
__ARCA_REFRESH__
<title>Arca: GitHub runners</title>
<style>
  :root { color-scheme: light dark; --arca-bg: #f4f4f7; --arca-surface: #fff; --arca-ink: #0c0d11; --arca-muted: #5d6170; --arca-accent: #5b54f9; --arca-warn: #9a5b00; --arca-ok: #1f7a4d; --arca-line: rgba(12, 13, 17, .12); }
  @media (prefers-color-scheme: dark) { :root { --arca-bg: #0b0b0f; --arca-surface: #15161c; --arca-ink: #f1f2f6; --arca-muted: #a4a9b7; --arca-accent: #8b85ff; --arca-warn: #f5b14c; --arca-ok: #5fd39a; --arca-line: rgba(255, 255, 255, .13); } }
  html, body { margin: 0; background: var(--arca-bg); color: var(--arca-ink); font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(44rem, calc(100% - 2rem)); margin: 2rem auto 3rem; box-sizing: border-box; }
  h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
  p, li { color: var(--arca-muted); }
  section { margin: 1rem 0; padding: 1.25rem; border: 1px solid var(--arca-line); border-radius: 1rem; background: var(--arca-surface); }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 650; }
  input, textarea { width: 100%; box-sizing: border-box; padding: .6rem .7rem; border: 1px solid var(--arca-line); border-radius: .6rem; background: var(--arca-bg); color: var(--arca-ink); font: inherit; }
  button { margin-top: 1rem; border: 0; border-radius: .7rem; padding: .75rem 1rem; background: var(--arca-accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
  button.quiet { background: transparent; color: var(--arca-warn); border: 1px solid var(--arca-line); }
  .code { font: 700 2rem/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .15em; margin: .5rem 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .9rem; word-break: break-all; }
  .ok { color: var(--arca-ok); }
  .bad { color: var(--arca-warn); }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
  ol.steps { padding-left: 1.25rem; }
  ol.steps li { margin: .35rem 0; }
  a { color: var(--arca-accent); }
</style>
</head>
<body>
<main>
__ARCA_BODY__
</main>
</body>
</html>
